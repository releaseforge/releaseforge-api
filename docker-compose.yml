services:
  postgres:
    image: postgres:16-alpine
    container_name: releaseforge-db
    environment:
      POSTGRES_DB: releaseforge
      POSTGRES_USER: releaseforge
      POSTGRES_PASSWORD: releaseforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releaseforge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
